<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Tic Tac Toe · Arcade Portal</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../styles/styles.css">
  <link rel="stylesheet" href="../arcade-nav.css">
  <link rel="stylesheet" href="styles/style.css">
  <script defer src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#gameBoard">Skip to board</a>
  <header class="site-header">
    <div class="shell topbar">
      <a class="brand" href="../../index.html" aria-label="Arcade Portal home">
        <span class="brand-mark" aria-hidden="true"><i></i></span>
        <span>Arcade<span class="brand-accent">Portal</span></span>
      </a>
      <a class="back-home-btn" href="../../index.html#library">← Back to Arcade</a>
    </div>
  </header>

  <main class="shell">
    <header class="marquee">
      <div class="marquee-copy">
        <h1>Tic <span>Tac</span> Toe</h1>
        <p>Get three in a row, column, or diagonal to win.</p>
      </div>
    </header>

    <div class="play-area">
      <section class="panel settings" aria-labelledby="mode-title">
        <h2 class="panel-title" id="mode-title"><i class="pad-icon" aria-hidden="true"></i>Game mode</h2>
        <div class="mode-switcher" role="group" aria-labelledby="mode-title">
          <button id="modePvp" type="button" class="mode-btn active" aria-pressed="true">
            <span>Player vs. player</span><i aria-hidden="true"></i>
          </button>
          <button id="modePvc" type="button" class="mode-btn" aria-pressed="false">
            <span>Player vs. computer</span><i aria-hidden="true"></i>
          </button>
        </div>
      </section>

      <section class="board-panel panel" aria-label="Play Tic Tac Toe">
        <div class="round-bar">
          <div class="status-banner" id="statusBanner" role="status" aria-atomic="true" data-player="x">
            <span class="status-light" aria-hidden="true"></span>
            <span id="statusText">Player X’s turn</span>
          </div>
          <button class="reset-round" type="button" id="resetRoundBtn">
            <span aria-hidden="true">↻</span> Reset round
          </button>
        </div>
        <div class="board-bezel">
          <div class="game-board" id="gameBoard" role="group" aria-label="Game board" tabindex="-1">
            <button class="cell" type="button" data-cell-index="0" aria-label="Row 1, column 1, empty"></button>
            <button class="cell" type="button" data-cell-index="1" aria-label="Row 1, column 2, empty"></button>
            <button class="cell" type="button" data-cell-index="2" aria-label="Row 1, column 3, empty"></button>
            <button class="cell" type="button" data-cell-index="3" aria-label="Row 2, column 1, empty"></button>
            <button class="cell" type="button" data-cell-index="4" aria-label="Row 2, column 2, empty"></button>
            <button class="cell" type="button" data-cell-index="5" aria-label="Row 2, column 3, empty"></button>
            <button class="cell" type="button" data-cell-index="6" aria-label="Row 3, column 1, empty"></button>
            <button class="cell" type="button" data-cell-index="7" aria-label="Row 3, column 2, empty"></button>
            <button class="cell" type="button" data-cell-index="8" aria-label="Row 3, column 3, empty"></button>
          </div>
        </div>
      </section>

      <section class="panel scores" aria-labelledby="scores-title">
        <h2 class="panel-title" id="scores-title"><i class="bars-icon" aria-hidden="true"></i>Scoreboard</h2>
        <dl class="scoreboard">
          <div class="score-row score-x">
            <dt><span class="score-mark" aria-hidden="true">X</span>Player X<span class="sr-only"> wins</span></dt>
            <dd id="scoreX">0</dd>
          </div>
          <div class="score-row score-o">
            <dt><span class="score-mark" aria-hidden="true">O</span><span id="scoreOLabel">Player O</span><span class="sr-only"> wins</span></dt>
            <dd id="scoreO">0</dd>
          </div>
          <div class="score-row score-tie">
            <dt><span class="score-mark" aria-hidden="true">–</span>Ties</dt>
            <dd id="scoreTie">0</dd>
          </div>
        </dl>
        <button class="reset-scores" id="resetScoresBtn" type="button">Reset scores</button>
      </section>
    </div>
  </main>
</body>
</html>
